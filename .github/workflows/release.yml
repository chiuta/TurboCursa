name: release

# Builds the native game for Linux (three glibc levels: Ubuntu 26.04, Ubuntu 22.04 = glibc 2.35 and
# Debian 11 = glibc 2.31), Windows and macOS, the single-file web build and the
# source zip, then publishes them as a GitHub release.
#   - push a tag:      git tag v1.18.0 && git push origin v1.18.0
#   - or run manually: Actions > release > Run workflow (it creates the tag for you)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        default: "v1.18.0"

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, name: linux-x86_64, target: "", dir: target/release, bin: turbo }
          # older Linux: linked against an older glibc so the binary also starts on older distributions
          - { os: ubuntu-22.04, name: linux-x86_64-glibc2.35, target: "", dir: target/release, bin: turbo }
          - { os: ubuntu-26.04, name: linux-x86_64-glibc2.31, target: "", dir: target/release, bin: turbo, container: "rust:1-bullseye", experimental: true }
          - { os: windows-latest, name: windows-x86_64, target: "", dir: target/release, bin: turbo.exe }
          - { os: macos-latest, name: macos-arm64, target: "", dir: target/release, bin: turbo }
          - { os: macos-latest, name: macos-x86_64, target: x86_64-apple-darwin, dir: target/x86_64-apple-darwin/release, bin: turbo }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    # a build that fails in the experimental container must not block the whole release
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Debian 11 is end-of-life, use the archive mirror
        if: matrix.container != ''
        run: |
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$f" ] || continue
            sed -i 's|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|g; s|http://security.debian.org/debian-security|http://archive.debian.org/debian-security|g; s|http://deb.debian.org/debian|http://archive.debian.org/debian|g' "$f"
            sed -i '/bullseye-updates/d' "$f"
          done
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
      - name: Linux audio headers
        if: runner.os == 'Linux'
        run: |
          S=""; command -v sudo >/dev/null 2>&1 && S=sudo
          $S apt-get update && $S apt-get install -y libasound2-dev pkg-config
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then T="--target ${{ matrix.target }}"; else T=""; fi
          cargo build --release --features native,audio --bin turbo $T
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir pkg
          cp ${{ matrix.dir }}/${{ matrix.bin }} pkg/turbocursa
          cp LICENSE README.md pkg/
          tar -C pkg -czf turbocursa-${{ matrix.name }}.tar.gz .
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item ${{ matrix.dir }}/${{ matrix.bin }} pkg/turbocursa.exe
          Copy-Item LICENSE,README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath turbocursa-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.name }}
          path: turbocursa-${{ matrix.name }}.*

  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: ./build_web.sh
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/turbocursa.html

  publish:
    needs: [native, web]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Source zip and checksums
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # the tag comes from a workflow input: never trust it as shell text
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad tag: $TAG"; exit 1; }
          git archive --format=zip --prefix="turbocursa-${TAG}/" -o "out/turbocursa-src.zip" HEAD
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad tag: $TAG"; exit 1; }
          gh release create "$TAG" out/* --title "TURBOCURSA $TAG" --notes-file RELEASE_NOTES.md --target "$SHA" \
            || gh release upload "$TAG" out/* --clobber
          # make it the "latest" release so releases/latest/download/... links work
          gh release edit "$TAG" --prerelease=false --latest

  # After the release exists: put the released engine into the published game page and refresh the
  # version stamps (landing page text, app.json, sw.js cache name). Runs on main, never on the tag.
  pages:
    needs: [publish]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web-dist
      - name: Embed the released wasm and stamp the version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cargo_ver=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          if [ "v$cargo_ver" != "$TAG" ]; then echo "main is at $cargo_ver, release is $TAG: pages left alone"; exit 0; fi
          python3 -I scripts/embed-wasm.py web-dist/turbocursa.html docs/turbocursa.html
          python3 -I scripts/sync-version.py
      - name: Commit and push if anything changed
        run: |
          git add -A docs web
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git config user.name "pages (CI)"
          git config user.email "alexio@trom.tf"
          git commit -m "docs: game page with the released engine and version stamps [skip ci]"
          git push
