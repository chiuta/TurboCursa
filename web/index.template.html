 // gamepad: sticks / d-pad steer, RT or A gas, LT or B brake, X turbo, Start enter, Select back,
 // LB / RB gears, Y manual gearbox, right stick click photo mode (Enter / gears / photo are edge-triggered)
 let padPrev=0;
 function pollPad(){
  let b=0;
  try{const gps=navigator.getGamepads?navigator.getGamepads():[];
   for(const g of gps){if(!g||!g.connected)continue;
    const bt=i=>g.buttons[i]&&(g.buttons[i].pressed||g.buttons[i].value>.5),ax=g.axes[0]||0;
    if(ax<-.3||bt(14))b|=1;if(ax>.3||bt(15))b|=2;
    if(bt(7)||bt(0)||bt(12))b|=4;if(bt(6)||bt(1)||bt(13))b|=8;if(bt(2))b|=16;
    if(bt(9))b|=32;if(bt(8))b|=64;if(bt(5))b|=128;if(bt(4))b|=1<<14;if(bt(3))b|=1<<15;if(bt(11))b|=1<<16}}catch(x){}
  const edge=32|128|(1<<14)|(1<<15)|(1<<16),fresh=b&edge&~padPrev;
  const nb=(b&~edge)|fresh;padPrev=b;
  if(nb!==padBits){padBits=nb;push()}
 }
 // tilt steering (phones): tilt the device left / right; turned on with the ⟲ button or ?tilt=1
 function onTilt(ev){
  if(!tiltOn)return;
  const a=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  let t=a===90?ev.beta:a===-90||a===270?-ev.beta:ev.gamma;
  if(t==null||!isFinite(t))return;
  const nb=t<-8?1:t>8?2:0;
  if(nb!==tiltBits){tiltBits=nb;push()}
 }
